aid: onsiteiq
name: OnsiteIQ
description: >-
  OnsiteIQ is a construction intelligence platform for real estate owners and
  developers that combines regular on-site 360-degree reality capture with
  AI-powered computer vision to monitor construction progress across trades and
  asset classes. The platform documents projects visually week over week, turns
  the imagery into searchable, measurable records, and surfaces analytics and
  actionable insights that teams use to verify progress, support payment
  applications, and make business-critical decisions on projects anywhere in the
  world. OnsiteIQ is a private company headquartered in New York City and backed
  by Anthemis and Bullpen Capital. As surfaced through the API Evangelist
  network, OnsiteIQ publishes a marketing and product website but does not expose
  a public developer API, documentation portal, or machine-readable API surface
  at this time; this profile records that honest state alongside the company's
  identity and public web properties.
